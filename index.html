<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbus — Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <main class="shell">

    <header class="top-bar">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M6.5 20C4 20 2 18 2 15.5c0-2.1 1.4-3.9 3.3-4.4C5.1 9.8 6.7 8.5 8.5 8.5c.4 0 .8.1 1.2.2C10.7 7.1 12.2 6 14 6c2.8 0 5 2.2 5 5 0 .1 0 .3-.01.4C20.7 11.9 22 13.4 22 15.2c0 2.1-1.7 3.8-3.8 3.8H6.5z" fill="currentColor" opacity=".9"/>
        </svg>
        <span>nimbus</span>
      </div>
      <div class="top-right">
        <span id="place" class="location-tag">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          Locating…
        </span>
        <button id="reload" class="btn-refresh">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
    </header>

    <section class="hero-block" id="hero">
      <div class="hero-left">
        <div class="temp-display">
          <span id="temp" class="big-temp">—</span>
          <span class="deg">°C</span>
        </div>
        <p id="desc" class="condition">—</p>
        <div class="meta-row">
          <div class="meta-chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 17.93V18h-2v1.93C7.06 19.44 4.56 16.94 4.07 14H6v-2H4.07C4.56 9.06 7.06 6.56 10 6.07V8h2V6.07c2.94.49 5.44 2.99 5.93 5.93H16v2h1.93c-.49 2.94-2.99 5.44-5.93 5.93z"/></svg>
            <span id="humidity">—</span>
          </div>
          <div class="meta-chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
            <span id="feel">—</span>
          </div>
          <div class="meta-chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 6.5C14.5 7.88 13.38 9 12 9S9.5 7.88 9.5 6.5 10.62 4 12 4s2.5 1.12 2.5 2.5zM12 11c-2.33 0-7 1.17-7 3.5V17h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span id="wind">—</span>
          </div>
        </div>
      </div>
      <div class="hero-right">
        <div class="icon-ring">
          <img id="icon" src="" alt="weather icon">
        </div>
      </div>
    </section>

    <section class="forecast-section">
      <div class="section-heading">
        <span class="section-line"></span>
        <span>5-DAY FORECAST</span>
        <span class="section-line"></span>
      </div>
      <div id="days" class="days-row"></div>
    </section>

  </main>

  <div id="loading-overlay" class="loading-overlay">
    <div class="loader-ring"></div>
    <p>Fetching sky conditions…</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
